name: Weekly stats refresh

# Runs every Sunday at 6:45am America/Detroit (10:45 UTC) -- early Sunday
# morning, still after essentially all NAIA/JUCO/D2/FCS games for the week
# are complete. Deliberately NOT the same :00 slot colleges-refresh.yml uses
# daily: this job landed exactly on "0 10 * * 0" for weeks, colliding with
# colleges-refresh's "0 10 * * *" every single Sunday, and GitHub Actions
# silently dropped this job's trigger outright on at least two consecutive
# Sundays (2026-10-04, 2026-10-11) as a result -- it never ran, scheduled or
# otherwise, until manually dispatched. Offsetting the minute avoids landing
# on the exact same queueing instant as that (or any other) cron. Also
# runnable manually from the Actions tab (workflow_dispatch) for testing.
#
# What this does: re-runs the scraper for every division and commits the
# refreshed frontend/src/data/real-stats.json + scraper/snapshots/ straight
# back to this repo, then asks the Pages workflow to redeploy the site (the
# stats are bundled into it). If one source is unreachable -- NAIA's site puts a
# bot check in front of the scraper at times -- that division keeps its last
# data, shows as a yellow warning on the run, and the rest still refresh.
# (Claude's own scheduled cloud routines can't reach these stats sites at
# all, confirmed directly -- see scraper/README.md).
#
# Also regenerates the MAC study (frontend/src/data/studies/mac-best-by-position.json) right after,
# since its current (2026) season reads straight from the real-stats.json this job just refreshed --
# see studies/mac_best_by_position.py's module docstring.
#
# GitHub drops scheduled runs now and then (it did again on 2026-10-18: nothing fired at 10:45 UTC at all, while the
# other workflows' crons ran as usual). So there are eight slots -- five on Sunday, three on Monday -- and a
# scheduled run that finds this week's snapshots already saved stops straight away, so only the first slot that
# actually fires does the work. A manual run always refreshes.
on:
  schedule:
    - cron: "45 10 * * 0"
    - cron: "37 12 * * 0"
    - cron: "17 15 * * 0"
    - cron: "7 18 * * 0"
    - cron: "23 21 * * 0"
    - cron: "45 10 * * 1"
    - cron: "17 13 * * 1"
    - cron: "41 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # to ask the Pages workflow to redeploy (a push made with the built-in token doesn't trigger it)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this week's stats were already saved
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          # A snapshot file is named <division>-YYYY-MM-DD.json; one from the last 5 days means this week's run happened.
          latest=$(ls scraper/snapshots | sed -En 's/.*-([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$/\1/p' | sort | tail -1)
          age=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 86400 ))
          echo "newest snapshot: $latest ($age days old)"
          if [ "$age" -lt 5 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        if: steps.fresh.outputs.skip != 'true'
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run the scraper (all divisions)
        if: steps.fresh.outputs.skip != 'true'
        working-directory: scraper
        run: python3 build_data.py

      - name: Regenerate the MAC study (2026 reads the real-stats.json this run just wrote)
        if: steps.fresh.outputs.skip != 'true'
        working-directory: scraper
        run: python3 studies/mac_best_by_position.py

      - name: Commit, push and redeploy
        if: steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gridline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/data/real-stats.json scraper/snapshots/ frontend/src/data/studies/mac-best-by-position.json
          if git diff --cached --quiet; then
            echo "No data changes this run -- nothing to commit."
          else
            git commit -m "Weekly stats refresh ($(date -u +%Y-%m-%d))"
            # The run takes ~15 minutes, and the repo may have moved on meanwhile: rebase onto it, then push.
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $attempt failed; retrying"
              sleep 5
            done
            git status -sb | head -1
            gh workflow run deploy-pages.yml
          fi
