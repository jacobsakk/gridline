name: Watch list bio / link lookup

# Fills in Height, Weight, X (Twitter), and Film Link for watch list
# players who don't have them yet, using the Tavily Search API on the
# same query the front-end's own "Search" button already builds
# (player + team + position + "football"). Writes straight to Firestore
# over its public REST API (no service account needed -- firestore.rules
# already allows open read/write on the watchlist collection). Never
# touches a field someone already filled in by hand.
#
# Needs one repo secret: TAVILY_API_KEY (see scraper/watchlist_enrich.py
# for where to get it -- no credit card required, unlike Google's Custom
# Search API, which turned out to no longer be available to new Google
# Cloud projects at all). Runs daily rather than weekly since the watch
# list changes whenever someone adds a player, and the script self-
# limits well under the free 1,000-searches/month Tavily quota.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Look up bio info / links for watch list players
        working-directory: scraper
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python3 watchlist_enrich.py
