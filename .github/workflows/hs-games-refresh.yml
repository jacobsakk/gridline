name: HS game results refresh

# Pulls the latest high school football results for every school on the
# HS Game Update tab from MaxPreps and ScoreStream, cross-references the two,
# and stores them in the database (hsTeams) where the app picks them up
# live -- nothing is committed to the repo, so no recruit information ever
# lands in it.
#
# Timed so Saturday morning already has Friday night's scores (times are UTC;
# GitHub can start a scheduled run up to ~20 minutes late):
#   Sat 03:00  = Fri 11pm Detroit  -- East/Midwest games are final
#   Sat 08:00  = Sat  4am Detroit  -- West Coast games are final
#   Sat 14:00  = Sat 10am Detroit  -- late score corrections
#   Fri 03:00  = Thu 11pm Detroit  -- Thursday-night games
#   Sun 14:00  = Sun 10am Detroit  -- anything reported late
# Also runnable by hand from the Actions tab.
#
# Needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key of a
# Firebase service account (Firebase console > Project settings > Service
# accounts > Generate new private key).
on:
  schedule:
    - cron: "0 3 * 8-12 6"        # Fri 11pm Detroit
    - cron: "0 8 * 8-12 6"        # Sat 4am Detroit
    - cron: "0 14 * 8-12 6"       # Sat 10am Detroit
    - cron: "0 3 * 8-12 5"        # Thu 11pm Detroit
    - cron: "0 14 * 8-12 0"       # Sun 10am Detroit
  workflow_dispatch:

concurrency:
  group: hs-games-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: |
          pip install -r scraper/requirements-hs.txt
          python -m playwright install --with-deps chromium

      - name: Scrape results and store them
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set -- see the comment at the top of this workflow."
            exit 1
          fi
          python3 hs_games.py
